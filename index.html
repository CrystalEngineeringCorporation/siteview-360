<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SiteView 360 — ดูรูป 360°</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1a1c1e; --ink:#f3f4f5; --muted:#b9bec4;
  --glass:rgba(24,26,29,.55); --glass-line:rgba(255,255,255,.18);
  --panel:rgba(22,24,27,.9); --sheet:rgba(22,24,27,.94); --soft:rgba(255,255,255,.05);
  --accent:#f2b705; --fov:rgba(255,255,255,.85);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
/* ธีม: ค่าเริ่มต้น = มืด (หน้าตาเดิม) · สว่าง/ตามระบบ เลือกจากเมนู ⋯ */
:root[data-theme="light"]{ --bg:#eef0f2; --ink:#1a1c1e; --muted:#59616a; --glass:rgba(255,255,255,.74); --glass-line:rgba(0,0,0,.14);
  --panel:rgba(250,251,252,.95); --sheet:rgba(246,247,249,.98); --soft:rgba(0,0,0,.04); color-scheme:light }
@media (prefers-color-scheme: light){ :root[data-theme="auto"]{ --bg:#eef0f2; --ink:#1a1c1e; --muted:#59616a; --glass:rgba(255,255,255,.74); --glass-line:rgba(0,0,0,.14);
  --panel:rgba(250,251,252,.95); --sheet:rgba(246,247,249,.98); --soft:rgba(0,0,0,.04); color-scheme:light } }
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
#stage{position:fixed;inset:0;touch-action:none;cursor:grab}
#stage.dragging{cursor:grabbing}
canvas{display:block;width:100%;height:100%}

.bar{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px;
  background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,0));pointer-events:none}
.bar>*{pointer-events:auto}
.logo{flex:0 0 auto;width:42px;height:42px;padding:3px;border-radius:10px;background:#fff;object-fit:contain;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.brand{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.co{font-size:11px;line-height:1.25;color:#fff;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.title{color:#fff;min-width:0;font-weight:600;font-size:15px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.btn{appearance:none;border:1px solid var(--glass-line);background:var(--glass);color:var(--ink);
  height:40px;min-width:40px;padding:0 12px;border-radius:20px;font:inherit;font-size:14px;
  display:inline-flex;align-items:center;gap:6px;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.btn svg{width:20px;height:20px}
.btn[aria-pressed="true"]{background:var(--accent);color:#1a1c1e;border-color:var(--accent)}
.btn:focus-visible,.compass:focus-visible,.thumb:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn .lbl{display:none}
@media (min-width:640px){.btn .lbl{display:inline}}
@media (max-width:560px){
  .bar{gap:6px}
  .bar .btn{height:38px;min-width:38px;padding:0 9px}
  .co{font-size:10px;line-height:1.2;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .title{font-size:13px;line-height:1.2}
}
@media (max-width:340px){ .co{display:none} }   /* จอแคบมาก: ชื่อบริษัทอยู่ในโลโก้อยู่แล้ว */

/* Facebook-style FOV compass */
:root{--sb:0px}                 /* ความสูงแถบรูป (0 เมื่อซ่อน) */
body.strip-on{--sb:80px}
.compass{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px + var(--sb));
  width:42px;height:42px;border-radius:50%;border:none;padding:0;background:transparent;cursor:pointer}
.compass svg{width:100%;height:100%;filter:drop-shadow(0 1px 3px rgba(0,0,0,.5))}

.strip{position:fixed;left:0;right:0;bottom:0;display:none;gap:8px;overflow-x:auto;
  padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 12px);
  background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.55))}
.strip:empty{display:none}
body.strip-on .strip{display:flex}
body.strip-on .strip:empty{display:none}
.thumb{flex:0 0 auto;width:96px;height:48px;border-radius:6px;border:2px solid transparent;padding:0;
  background:#333 center/cover no-repeat;cursor:pointer}
.thumb[aria-current="true"]{border-color:var(--accent)}

.hint{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:14px 18px;border-radius:14px;background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  font-size:14px;text-align:center;pointer-events:none;transition:opacity .4s}
.hint.gone{opacity:0}
.hint svg{width:36px;height:36px}

.drop{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,.6);border:3px dashed var(--accent);font-size:20px;font-weight:600}
.drop.on{display:flex}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 160px);transform:translateX(-50%);
  max-width:min(92vw,480px);padding:10px 14px;border-radius:10px;background:var(--glass);backdrop-filter:blur(8px);
  font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.on{opacity:1}
/* image status chip (ตัวอย่าง → ภาพเต็ม / ความละเอียด) */
.chip{position:fixed;left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 68px + var(--sb));max-width:min(72vw,380px);
  padding:5px 10px;border-radius:12px;background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid var(--glass-line);font-size:11px;line-height:1.45;pointer-events:none}
.chip.warn{border-color:var(--accent)}
/* Drive folder browser */
.sheet{position:fixed;left:0;right:0;bottom:0;height:85%;display:none;flex-direction:column;
  background:var(--sheet);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--glass-line);border-radius:16px 16px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.on{display:flex}
.sheet-head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--glass-line)}
.crumbs{flex:1;min-width:0;display:flex;gap:4px;overflow-x:auto;white-space:nowrap;font-size:14px}
.crumbs button{appearance:none;border:0;background:none;color:var(--muted);font:inherit;padding:4px 2px;cursor:pointer}
.crumbs button:last-child{color:var(--ink);font-weight:600}
.crumbs span{color:var(--muted)}
.sheet .btn{height:36px;min-width:36px;padding:0 10px}
.sheet-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));grid-auto-rows:max-content;align-content:start;gap:14px}
.item{appearance:none;border:1px solid var(--glass-line);background:var(--soft);color:var(--ink);font:inherit;
  border-radius:12px;padding:0;overflow:hidden;cursor:pointer;text-align:left;display:flex;flex-direction:column;flex-shrink:0}
.item .pic{aspect-ratio:2/1;background:#2a2d31 center/cover no-repeat;position:relative}
.item .pic b{position:absolute;right:8px;top:8px;font-size:12px;padding:3px 8px;border-radius:6px;background:var(--accent);color:#1a1c1e}
.item .nm{padding:8px 10px 2px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .dt{padding:0 10px 9px;font-size:12px;color:var(--muted)}
.item.folder{flex-direction:row;align-items:center;gap:10px;padding:14px}
.item.folder .nm{padding:0}
.item.folder svg{flex:0 0 22px;height:22px;color:var(--accent)}
.item:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.empty{grid-column:1/-1;color:var(--muted);font-size:14px;padding:8px 2px;line-height:1.6}
.linkform{grid-column:1/-1;display:flex;flex-direction:column;gap:8px}
.linkform input{height:42px;border-radius:10px;border:1px solid var(--glass-line);background:var(--soft);color:var(--ink);font:inherit;font-size:16px;padding:0 12px}
.linkform .btn{align-self:flex-start;background:var(--accent);color:#1a1c1e;border-color:var(--accent)}
/* view mode switch */
.modes{position:fixed;left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 24px + var(--sb));display:flex;padding:3px;gap:2px;
  border-radius:22px;border:1px solid var(--glass-line);background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.modes button{appearance:none;border:0;background:none;color:var(--ink);font:inherit;font-size:13px;height:34px;padding:0 12px;border-radius:18px;cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--accent);color:#1a1c1e;font-weight:600}
.modes button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
@media (max-width:340px){ .modes button{padding:0 8px;font-size:12px} }
.zoomctl{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 70px + var(--sb));display:flex;
  border-radius:14px;border:1px solid var(--glass-line);background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.zoomctl[hidden]{display:none}
.zoomctl .zrd{appearance:none;border:0;background:none;color:var(--ink);font:inherit;font-variant-numeric:tabular-nums;min-height:30px;padding:3px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center}
.zoomctl .zrd small{font-size:10px;color:var(--accent);white-space:nowrap;line-height:1.2}
.zoomctl .zrd small[hidden]{display:none}
.zoomctl .zrd b{font-size:13px}
.zoomctl .zrd:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:14px}
.zoomctl.deep .zrd b{color:var(--accent)}
.nav{position:fixed;top:30%;transform:translateY(-50%);width:36px;min-width:36px;height:72px;padding:0;justify-content:center;border:0;background:none;
  backdrop-filter:none;-webkit-backdrop-filter:none;opacity:.75;color:#fff;filter:drop-shadow(0 1px 3px rgba(0,0,0,.7))}
.nav svg{width:26px;height:26px}
.nav[hidden]{display:none}
.nav:disabled{opacity:.2;cursor:default}
.nav.prev{left:2px}.nav.next{right:2px}
/* horizon adjust (ปรับแนวระดับ) */
.hz.has::after,#moreBtn.has::after{content:"";position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
#moreBtn{position:relative}
.menu{position:fixed;z-index:5;right:12px;top:calc(env(safe-area-inset-top,0px) + 62px);display:flex;flex-direction:column;gap:4px;padding:8px;min-width:200px;
  border-radius:16px;border:1px solid var(--glass-line);background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.menu[hidden]{display:none}
.menu .btn{position:relative;width:100%;justify-content:flex-start;padding:0 12px;border-radius:12px;background:none;border-color:transparent}
.menu .btn .lbl{display:inline}
.menu{max-height:calc(100vh - 90px);overflow-y:auto}
.mzoom{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 4px;height:44px;font-size:14px;font-variant-numeric:tabular-nums}
.mzoom[hidden]{display:none}
.mzoom button{appearance:none;border:1px solid var(--glass-line);background:none;color:var(--ink);width:46px;height:36px;border-radius:12px;font:inherit;font-size:22px;line-height:1;cursor:pointer}
/* แถบโหมด: ย่อเหลือปุ่มเดียว แตะเพื่อกางตัวเลือก */
.modes:not(.open) button:not([aria-pressed="true"]){display:none}
.modes:not(.open) button[aria-pressed="true"]::after{content:"▾";margin-left:6px;font-size:11px}
.menu .btn[aria-pressed="true"]{background:var(--accent);color:#1a1c1e;border-color:var(--accent)}
/* โหมดนำเสนอ: ซ่อน UI ถาวร (ออกด้วยการแตะค้าง 1 วินาที) */
body.present .toast, body.present .chip, body.present .hint{display:none}
.exitp{position:fixed;z-index:6;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px}
/* ซ่อน UI อัตโนมัติเมื่อไม่ได้แตะ */
.bar,.modes,.zoomctl,.compass,.nav,.strip,.chip{transition:opacity .35s}
body.idle .bar,body.idle .modes,body.idle .zoomctl,body.idle .compass,body.idle .nav,body.idle .strip,body.idle .chip{opacity:0;pointer-events:none}
body.idle .bar>*{pointer-events:none}
@media (prefers-reduced-motion: reduce){.bar,.modes,.zoomctl,.compass,.nav,.strip,.chip{transition:none}}
.hzpanel{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 70px);max-width:420px;
  display:flex;flex-direction:column;gap:10px;padding:12px 14px;border-radius:14px;border:1px solid var(--glass-line);
  background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:14px}
.hz-head{display:flex;align-items:center;gap:8px}
.hz-head b{flex:1}
.hzpanel .btn{height:34px;min-width:0;padding:0 12px;font-size:13px}
.hzpanel .btn.done{background:var(--accent);color:#1a1c1e;border-color:var(--accent)}
.hzrow{display:flex;flex-direction:column;gap:2px}
.hzrow span{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}
.hzrow output{color:var(--ink);font-variant-numeric:tabular-nums}
.hzrow input{width:100%;height:30px;margin:0;accent-color:var(--accent);touch-action:pan-x}
.hz-tip{margin:0;color:var(--muted);font-size:12px;line-height:1.5}
.hzguide{position:fixed;inset:0;pointer-events:none;
  background:
    linear-gradient(rgba(255,255,255,.7),rgba(255,255,255,.7)) center/100% 1px no-repeat,
    linear-gradient(90deg,rgba(255,255,255,.45),rgba(255,255,255,.45)) 25% 0/1px 100% no-repeat,
    linear-gradient(90deg,rgba(255,255,255,.7),rgba(255,255,255,.7)) 50% 0/1px 100% no-repeat,
    linear-gradient(90deg,rgba(255,255,255,.45),rgba(255,255,255,.45)) 75% 0/1px 100% no-repeat}
@media (prefers-reduced-motion: reduce){.hint,.toast{transition:none}}
</style>
</head>
<body>
<div id="stage"></div>

<div class="bar">
  <img class="logo" src="logo.png" alt="Crystal Engineering Corporation" width="42" height="42">
  <div class="brand">
    <div class="co">คริสตัล เอ็นจิเนียริ่ง คอร์ปอเรชั่น</div>
    <div class="title" id="title">ภาพตัวอย่าง</div>
  </div>
  <button class="btn" id="moreBtn" aria-expanded="false" aria-controls="menu" title="เครื่องมือ" aria-label="เครื่องมือ">
    <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
  </button>
</div>

<button class="compass" id="compass" title="กลับทิศเริ่มต้น" aria-label="กลับทิศเริ่มต้น">
  <svg viewBox="0 0 56 56">
    <circle cx="28" cy="28" r="26" fill="rgba(0,0,0,.35)" stroke="rgba(255,255,255,.9)" stroke-width="2"/>
    <path id="wedge" fill="var(--fov)"/>
    <circle cx="28" cy="28" r="4" fill="#fff"/>
    <path d="M28 1 l4 5 h-8z" fill="var(--accent)"/>
  </svg>
</button>

<div class="menu" id="menu" hidden role="menu" aria-label="เครื่องมือ">
<div class="mzoom" id="mzoom"><button id="zOut" aria-label="ซูมออก" title="ซูมออก">−</button><span id="zFov">FOV 75°</span><button id="zIn" aria-label="ซูมเข้า" title="ซูมเข้า">+</button></div>
  <label class="btn" title="เปิดรูป 360">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg>
    <span class="lbl">เปิดรูป</span>
    <input id="file" type="file" accept="image/*" multiple hidden>
  </label>
  <button class="btn" id="driveBtn" title="รูปจากโฟลเดอร์ Google Drive">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M8 3h8l6 10-4 7H6l-4-7z"/><path d="M8 3l6 10h8M2 13h12l-4 7"/></svg>
    <span class="lbl">Google Drive</span>
  </button>
<button class="btn" id="rotBtn" aria-pressed="false" title="หมุนภาพอัตโนมัติ">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg>
  <span class="lbl">หมุนอัตโนมัติ</span>
</button>
<button class="btn" id="presentBtn" title="โหมดนำเสนอ — ซ่อนปุ่มทั้งหมด">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M12 16v4M8 20h8"/></svg>
  <span class="lbl">โหมดนำเสนอ</span>
</button>
<button class="btn" id="themeBtn" title="ธีมสี">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 4v16" /><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>
  <span class="lbl" id="themeLbl">ธีม: มืด</span>
</button>
<button class="btn" id="stripBtn" aria-pressed="false" title="แสดง/ซ่อนแถบรูป">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="14" width="5" height="6" rx="1"/><rect x="9.5" y="14" width="5" height="6" rx="1"/><rect x="16" y="14" width="5" height="6" rx="1"/><path d="M3 9h18"/></svg>
  <span class="lbl">แถบรูป</span>
</button>
  <button class="btn" id="gyroBtn" aria-pressed="false" title="หมุนตามมือถือ">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>
    <span class="lbl">หมุนตามเครื่อง</span>
  </button>
  <button class="btn" id="fsBtn" title="เต็มจอ">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    <span class="lbl">เต็มจอ</span>
</button>
<button class="btn snap" id="snapBtn" title="บันทึกภาพมุมมองปัจจุบัน" aria-label="บันทึกภาพมุมมองปัจจุบัน">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
  <span class="lbl">บันทึกภาพ</span>
</button>
<button class="btn hz" id="hzBtn" aria-expanded="false" aria-controls="hzPanel" title="ปรับแนวระดับ" aria-label="ปรับแนวระดับ">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 15l18-5"/><path d="M12 3v3M5 6l2 2M19 6l-2 2"/></svg>
  <span class="lbl">ปรับแนวระดับ</span>
</button>
</div>
<button class="btn exitp" id="exitP" hidden>ออกจากโหมดนำเสนอ</button>
<div class="modes" role="group" aria-label="มุมมอง">
  <button data-mode="0" aria-pressed="true" title="มุมมองปกติ">ปกติ</button>
  <button data-mode="3" aria-pressed="false" title="กว้าง — กว้างกว่าปกติ โค้งน้อยกว่ากว้างพิเศษ">กว้าง</button>

<script>
/* ===== ตั้งค่า Google Drive (จาก Google Cloud Console) ===== */
window.DRIVE_CONFIG = {

  CLIENT_ID: 'YOUR_CLIENT_ID.apps.googleusercontent.com', // ใช้เมื่อโฟลเดอร์ไม่เปิดสาธารณะ (ล็อกอิน Google, scope drive.readonly)
  DEFAULT_FOLDER: 'https://drive.google.com/drive/folders/10L7lLKOrBJFp_zcJoEmhpMfQsApy9AeX', // โฟลเดอร์ 0. รูป 360 องศา
  LOCK_FOLDER: true                                        // true = ใช้โฟลเดอร์นี้เสมอ ซ่อนปุ่มเปลี่ยนลิงก์

<script>
(() => {
const $ = id => document.getElementById(id);
const stage = $('stage');
const R = 500;
// view modes: 0 = ปกติ (rectilinear), 1 = กว้างพิเศษ (stereographic), 2 = ตรง (แนวดิ่งขนาน / shift lens),
//             3 = กว้าง (stereographic มุมกว้างปานกลาง — เห็นกว้างกว่าปกติ แต่ไม่โค้งเป็นดาวเคราะห์)
const MODES = [ { fov: 75, min: 30, max: 100 }, { fov: 200, min: 100, max: 290 }, { fov: 80, min: 30, max: 100 }, { fov: 120, min: 80, max: 170 } ];
const isStereo = () => mode === 1 || mode === 3;
let mode = 0, fov = 75, vDeg = 180;
// ซูมลึกในมุมมองปกติ: ×1.0 = FOV 75° (ค่าเริ่มต้นเดิม) · เกิน FOV 30° (เดิมคือขีดสุดของโหมดปกติ) ปุ่มจะเปลี่ยนชื่อเป็น "ซูม"
const Z0 = Math.tan(75 * Math.PI / 360), NORMAL_MIN = 30, ZOOM_ENTER = 29.5, ZOOM_EXIT = 30.5, MAX_UPSCALE = 3, DEEP_FLOOR = 6;
let texW = 0, zoomMode = false;

// ---------- three setup ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, 1, 1, 1100);   // used for orientation only
// ค่าเริ่มต้น = ใช้ขนาดสูงสุดที่ GPU รองรับ (ไม่ย่อรูปถ้าไม่เกิน) — เติม ?safe=1 ท้ายลิงก์เพื่อจำกัด 8192 กันแรมมือถือเต็ม
const SAFE = /[?&]safe=1\b/.test(location.search), DEBUG = /[?&]debug=1\b/.test(location.search);
const maxTex = SAFE ? Math.min(renderer.capabilities.maxTextureSize, 8192) : renderer.capabilities.maxTextureSize;
const U = {
  tex: { value: null }, mode: { value: 0 }, rot: { value: new THREE.Matrix3() },
  t: { value: 1 }, ks: { value: 1 }, aspect: { value: 1 }, shift: { value: 0 },
  fwd: { value: new THREE.Vector3(0, 0, -1) }, rgt: { value: new THREE.Vector3(1, 0, 0) },
  th0: { value: 0 }, thLen: { value: Math.PI }, corr: { value: new THREE.Matrix3() }
};
const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
  uniforms: U, depthTest: false, depthWrite: false,
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
  fragmentShader: `
    precision highp float;
    uniform sampler2D tex; uniform int mode; uniform mat3 rot, corr;
    uniform float t, ks, aspect, shift, th0, thLen; uniform vec3 fwd, rgt;
    varying vec2 vUv;
    const float TAU = 6.28318530718;
    void main(){
      vec2 n = vUv * 2.0 - 1.0;
      vec3 d;
      if (mode == 1){                       // stereographic: fov spans the shorter screen side
        vec2 p = n * vec2(aspect, 1.0) / min(aspect, 1.0);
        float r = length(p) * ks, a = 2.0 * atan(r * 0.5);
        vec2 q = r > 0.0 ? p / length(p) : vec2(0.0);
        d = rot * vec3(q * sin(a), -cos(a));
      } else if (mode == 2){                // level camera + vertical lens shift => verticals stay vertical
        vec2 p = n * vec2(aspect, 1.0);
        d = rgt * (p.x * t) + vec3(0.0, 1.0, 0.0) * (p.y * t + shift) + fwd;
      } else {                              // normal perspective
        vec2 p = n * vec2(aspect, 1.0);
        d = rot * vec3(p * t, -1.0);
      }
      d = normalize(corr * d);               // horizon correction (per image)
      float ph = atan(d.z, d.x); if (ph < 0.0) ph += TAU;
      float v = (acos(clamp(d.y, -1.0, 1.0)) - th0) / thLen;
      if (v < 0.0 || v > 1.0){ gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0); return; }
      gl_FragColor = texture2D(tex, vec2(ph / TAU, 1.0 - v));
    }`
}));
quad.frustumCulled = false;
scene.add(quad);

function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  U.aspect.value = w / h;
}
addEventListener('resize', resize); resize();

// ---------- view state ----------
let lon = 0, lat = 0, vLon = 0, vLat = 0;
let dragging = false, interacted = false;
const pointers = new Map();
let lastX = 0, lastY = 0, lastT = 0, pinchDist = 0;

// opt.keep = สลับภาพ (ตัวอย่าง → ภาพเต็ม) โดยคงมุมมองและสไลเดอร์ปรับระดับไว้ · คืนค่าขนาดต้นฉบับ/ขนาดที่ส่งเข้า GPU
function setPano(img, name, key, opt = {}){
  const t0 = performance.now(); shown = img;
  // Downscale only if bigger than the GPU limit (Osmo 360 120MP photos are 15520 px wide)
  let src = img, w = img.width, h = img.height;
  if (w > maxTex){
    const s = maxTex / w, c = document.createElement('canvas');
    c.width = Math.round(w * s); c.height = Math.round(h * s);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    src = c;
  }
  texW = src.width;
  const tex = new THREE.Texture(src);
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  tex.minFilter = THREE.LinearFilter; tex.generateMipmaps = false;
  tex.needsUpdate = true;

  // 2:1 => full sphere; wider => partial vertical coverage (phone panoramas)
  const aspect = w / h;
  vDeg = Math.min(180, 360 / aspect);
  if (U.tex.value) U.tex.value.dispose();
  U.tex.value = tex;
  U.th0.value = THREE.MathUtils.degToRad((180 - vDeg) / 2);
  U.thLen.value = THREE.MathUtils.degToRad(vDeg);
  $('title').textContent = name;
  if (!opt.keep){
    lon = 0; lat = 0; vLon = vLat = 0;
    hzLoad(key);
    if (Math.abs(aspect - 2) > 0.05) toast(`รูปไม่ใช่สัดส่วน 2:1 (${aspect.toFixed(2)}:1) — แสดงเป็นพาโนรามาบางส่วน`);
  }
  return { w, h, tw: src.width, th: src.height, ms: Math.round(performance.now() - t0) };
}

// ---------- demo pano (test grid) ----------
function demoPano(){
  const c = document.createElement('canvas'); c.width = 4096; c.height = 2048;
  const g = c.getContext('2d');
  const sky = g.createLinearGradient(0,0,0,1024); sky.addColorStop(0,'#5b87b8'); sky.addColorStop(1,'#cfd9e2');
  g.fillStyle = sky; g.fillRect(0,0,4096,1024);
  const gr = g.createLinearGradient(0,1024,0,2048); gr.addColorStop(0,'#8a8173'); gr.addColorStop(1,'#4b463f');
  g.fillStyle = gr; g.fillRect(0,1024,4096,1024);
  g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = 2;
  for (let x=0;x<=4096;x+=4096/36){ g.beginPath(); g.moveTo(x,0); g.lineTo(x,2048); g.stroke(); }
  for (let y=0;y<=2048;y+=2048/18){ g.beginPath(); g.moveTo(0,y); g.lineTo(4096,y); g.stroke(); }
  g.fillStyle = '#fff'; g.font = '600 120px "IBM Plex Sans Thai", sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  [['N',0],['E',90],['S',180],['W',270]].forEach(([t,d]) => {
    const x = ((d + 180) % 360) / 360 * 4096;   // lon 0 = image centre
    g.fillText(t, x, 900);
  });
  g.font = '400 56px "IBM Plex Sans Thai", sans-serif';
  g.fillText('กด "เปิดรูป" เพื่อเลือกรูป 360 จากเครื่อง', 2048, 1180);
  return c;
}

// ---------- input: drag / inertia / zoom ----------
stage.addEventListener('pointerdown', e => {
  stage.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, e);
  if (pointers.size === 1){
    dragging = true; stage.classList.add('dragging');
    lastX = e.clientX; lastY = e.clientY; lastT = performance.now(); vLon = vLat = 0;
  } else if (pointers.size === 2){
    const [a,b] = [...pointers.values()];
    pinchDist = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
  }
  markInteracted();
});
stage.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, e);
  if (pointers.size === 2){
    const [a,b] = [...pointers.values()];
    const d = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
    if (pinchDist) zoomBy(pinchDist / d);
    pinchDist = d; return;
  }
  if (!dragging) return;
  // degrees per pixel scale with FOV, so dragging feels 1:1 with the image
  const k = THREE.MathUtils.radToDeg(radPerPx());
  const dx = (e.clientX - lastX) * k, dy = (e.clientY - lastY) * k;
  const now = performance.now(), dt = Math.max(1, now - lastT);
  if (gyroOn){ gyroOffset += THREE.MathUtils.degToRad(dx); }
  else { lon -= dx; lat += dy; }
  vLon = -dx / dt * 16; vLat = dy / dt * 16;
  lastX = e.clientX; lastY = e.clientY; lastT = now;
});
function endPointer(e){
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinchDist = 0;
  if (pointers.size === 0){
    dragging = false; stage.classList.remove('dragging');
    if (performance.now() - lastT > 80 || matchMedia('(prefers-reduced-motion: reduce)').matches) vLon = vLat = 0;
  } else {
    const p = [...pointers.values()][0]; lastX = p.clientX; lastY = p.clientY;
  }
}
stage.addEventListener('pointerup', endPointer);
stage.addEventListener('pointercancel', endPointer);
stage.addEventListener('wheel', e => { e.preventDefault(); zoomBy(Math.exp(e.deltaY * 0.001)); markInteracted(); }, { passive:false });
stage.addEventListener('dblclick', () => zoomBy(fov > (MODES[mode].min + MODES[mode].max) / 2 ? 0.6 : 1.6));

// ขีดซูมลึกสุดของโหมดปกติ: ปล่อยให้ภาพขยายเกินพิกเซลจริงได้ไม่เกิน MAX_UPSCALE เท่า (อิงความกว้างภาพที่ส่งเข้า GPU จริง)
function fovMin(){
  if (mode !== 0 || !texW) return MODES[mode].min;
  const screenPx = innerHeight * Math.min(devicePixelRatio, 2);
  return THREE.MathUtils.clamp(screenPx / MAX_UPSCALE * 360 / texW, DEEP_FLOOR, NORMAL_MIN);
}
function zoomBy(f){ fov = THREE.MathUtils.clamp(fov * f, fovMin(), MODES[mode].max); }
const zoomX = () => Z0 / Math.tan(THREE.MathUtils.degToRad(fov) / 2);
// พิกเซลภาพต่อพิกเซลจอ: >1 = ภาพถูกขยายเกินความละเอียดจริง
const upscale = () => !texW ? 0 : (innerHeight * Math.min(devicePixelRatio, 2)) / (THREE.MathUtils.degToRad(fov) * texW / (2 * Math.PI));
function syncZoomUI(){
  const on = mode === 0;
  $('zoomCtl').hidden = !on; $('mzoom').hidden = !on;
  const up = on ? upscale() : 0, soft = up > 1.05;
  $('zNote').hidden = !soft;
  if (!on){ zoomMode = false; setModeLabel(); return; }
  if (!zoomMode && fov < ZOOM_ENTER) zoomMode = true; else if (zoomMode && fov > ZOOM_EXIT) zoomMode = false;
  setModeLabel();
  $('zX').textContent = '×' + zoomX().toFixed(zoomX() < 10 ? 1 : 0);
  $('zFov').textContent = 'FOV ' + Math.round(fov) + '°';
  $('zoomCtl').classList.toggle('deep', zoomMode);
  if (soft) $('zNote').textContent = 'ขยาย ' + up.toFixed(1) + '×';
}
const modeBtn0 = document.querySelector('.modes button[data-mode="0"]');
function setModeLabel(){
  const t = zoomMode ? 'ซูม' : 'ปกติ';
  if (modeBtn0.textContent !== t){ modeBtn0.textContent = t; modeBtn0.title = zoomMode ? 'โหมดซูม — ซูมเกินช่วงปกติ (แตะเพื่อกลับมุมปกติ)' : 'มุมมองปกติ'; }
}
$('zIn').addEventListener('click', () => { zoomBy(0.75); markInteracted(); });
$('zOut').addEventListener('click', () => { zoomBy(1 / 0.75); markInteracted(); });
$('zRead').addEventListener('click', () => { fov = MODES[0].fov; });
const tanHalf = () => Math.tan(THREE.MathUtils.degToRad(fov) / 2);
const stereoK = () => 2 * Math.tan(THREE.MathUtils.degToRad(fov) / 4);
function radPerPx(){
  return isStereo() ? 2 * stereoK() / Math.min(innerWidth, innerHeight) : 2 * tanHalf() / innerHeight;
}
function latMax(){
  if (isStereo()) return vDeg >= 179 ? 89 : Math.max(0, vDeg / 2 - 30);
  if (mode === 2) return Math.min(55, vDeg >= 179 ? 55 : Math.max(0, vDeg / 2 - fov / 2));
  return vDeg >= 179 ? 85 : Math.max(0, vDeg / 2 - fov / 2);
}
function setMode(m){
  mode = m; fov = MODES[m].fov;
  document.querySelectorAll('.modes button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.mode === m)));
  toast(['มุมมองปกติ', 'กว้างพิเศษ — ก้มลงสุดจะเห็นเป็นดาวเคราะห์จิ๋ว', 'แนวดิ่งตรง — เสา/ผนังไม่เอียงเวลาก้มเงย', 'กว้าง — กว้างกว่าปกติ แต่ไม่โค้งมาก'][m]);
}
document.querySelectorAll('.modes button').forEach(b => b.addEventListener('click', () => setMode(+b.dataset.mode)));
function markInteracted(){ if (!interacted){ interacted = true; $('hint').classList.add('gone'); } }

// ---------- gyroscope ----------
let gyroOn = false, gyroOffset = 0, orient = null;
const zee = new THREE.Vector3(0,0,1), euler = new THREE.Euler(), q0 = new THREE.Quaternion(),
      q1 = new THREE.Quaternion(-Math.sqrt(.5), 0, 0, Math.sqrt(.5));
function onOrient(e){ orient = e; }
$('gyroBtn').addEventListener('click', async () => {
  if (gyroOn){ gyroOn = false; $('gyroBtn').setAttribute('aria-pressed','false'); removeEventListener('deviceorientation', onOrient); return; }
  try {
    if (typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission){
      const r = await DeviceOrientationEvent.requestPermission();
      if (r !== 'granted') throw new Error('denied');
    }
    if (!('DeviceOrientationEvent' in window)) throw new Error('none');
    addEventListener('deviceorientation', onOrient);
    gyroOn = true; gyroOffset = 0; $('gyroBtn').setAttribute('aria-pressed','true');
    markInteracted();
    setTimeout(() => { if (gyroOn && !orient) toast('อุปกรณ์นี้ไม่ส่งข้อมูลเซนเซอร์ (ต้องเปิดผ่าน https บนมือถือ)'); }, 1500);
  } catch { toast('ไม่ได้รับสิทธิ์ใช้เซนเซอร์หมุน — ลากนิ้วเพื่อหมุนแทนได้'); }
});
function applyGyro(){
  const a = THREE.MathUtils.degToRad(orient.alpha || 0) + gyroOffset;
  const b = THREE.MathUtils.degToRad(orient.beta || 0);
  const g = THREE.MathUtils.degToRad(orient.gamma || 0);
  const s = THREE.MathUtils.degToRad((screen.orientation && screen.orientation.angle) || window.orientation || 0);
  euler.set(b, a, -g, 'YXZ');
  camera.quaternion.setFromEuler(euler);
  camera.quaternion.multiply(q1);
  camera.quaternion.multiply(q0.setFromAxisAngle(zee, -s));
}

// ---------- compass (Facebook-style FOV wedge) ----------
const wedge = $('wedge'), dir = new THREE.Vector3();
function drawCompass(){
  camera.getWorldDirection(dir);
  const yaw = Math.atan2(dir.x, -dir.z);  // 0 = start direction, clockwise
  const hFov = isStereo()
    ? Math.min(2 * Math.PI - 0.01, 4 * Math.atan(camera.aspect / Math.min(camera.aspect, 1) * stereoK() / 2))
    : 2 * Math.atan(tanHalf() * camera.aspect);
  const r = 24, a0 = yaw - hFov / 2, a1 = yaw + hFov / 2;
  const p = a => `${28 + r * Math.sin(a)} ${28 - r * Math.cos(a)}`;

const hzPanel = $('hzPanel'), hzGuide = $('hzGuide'), hzBtn = $('hzBtn');
const hzQ = new THREE.Quaternion(), hzBase = new THREE.Quaternion(), hzInv = new THREE.Quaternion(), hzId = new THREE.Quaternion();
const hzF = new THREE.Vector3(0, 0, -1), hzR = new THREE.Vector3(1, 0, 0), hzM4 = new THREE.Matrix4();
const hzA = new THREE.Quaternion(), hzB = new THREE.Quaternion();
let hzKey = null;
const hzIsId = () => hzQ.angleTo(hzId) < 1e-4;
function hzSave(){ if (hzKey) store('sv360.hz.' + hzKey, hzIsId() ? null : JSON.stringify(hzQ.toArray())); }
function hzMark(){ hzBtn.classList.toggle('has', !hzIsId()); }
function hzClose(){ hzPanel.hidden = true; hzGuide.hidden = true; hzBtn.setAttribute('aria-expanded', 'false'); }
function hzLoad(key){

  if (hzKey){ try { const a = JSON.parse(load('sv360.hz.' + hzKey));
    if (Array.isArray(a) && a.length === 4 && a.every(Number.isFinite)) hzQ.fromArray(a).normalize(); } catch {} }

}
function hzApply(){
  const roll = +$('hzRoll').value, pitch = +$('hzPitch').value;

  hzB.setFromAxisAngle(hzR, THREE.MathUtils.degToRad(pitch));
  hzQ.copy(hzA).multiply(hzB).multiply(hzBase).normalize();
  $('hzRollV').textContent = roll.toFixed(1) + '°'; $('hzPitchV').textContent = pitch.toFixed(1) + '°';

}
function hzOpen(){

}

// ---------- loop ----------
const target = new THREE.Vector3();
let t0 = performance.now();
function loop(now){
  const dt = Math.min(64, now - t0); t0 = now;
  if (gyroOn && orient){ applyGyro(); }
  else {
    if (!dragging){
      if (!interacted && !matchMedia('(prefers-reduced-motion: reduce)').matches) lon += dt * 0.004; // gentle intro spin
      lon += vLon; lat += vLat; vLon *= 0.92; vLat *= 0.92;
      if (autoRot && now - lastInput > AUTO_RESUME_MS) lon += dt * AUTO_RATE;
      if (Math.abs(vLon) < 0.001) vLon = 0; if (Math.abs(vLat) < 0.001) vLat = 0;
    }
    lat = THREE.MathUtils.clamp(lat, -latMax(), latMax());
    const phi = THREE.MathUtils.degToRad(90 - lat), th = THREE.MathUtils.degToRad(lon - 90);
    target.set(R * Math.sin(phi) * Math.cos(th), R * Math.cos(phi), R * Math.sin(phi) * Math.sin(th));
    camera.lookAt(target);
  }
  camera.updateMatrixWorld();
  U.rot.value.setFromMatrix4(camera.matrixWorld);
  syncZoomUI();
  U.mode.value = isStereo() ? 1 : mode; U.t.value = tanHalf(); U.ks.value = stereoK();
  U.corr.value.setFromMatrix4(hzM4.makeRotationFromQuaternion(hzInv.copy(hzQ).invert()));
  camera.getWorldDirection(dir);
  const hz = Math.hypot(dir.x, dir.z);
  if (hz > 1e-4){ U.fwd.value.set(dir.x / hz, 0, dir.z / hz); U.rgt.value.set(-dir.z / hz, 0, dir.x / hz); }
  const lim = THREE.MathUtils.degToRad(55);
  U.shift.value = Math.tan(THREE.MathUtils.clamp(Math.asin(THREE.MathUtils.clamp(dir.y, -1, 1)), -lim, lim));
  drawCompass();
  moreBtn.classList.toggle('has', gyroOn || autoRot || hzBtn.classList.contains('has'));
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

const chip = $('chip'); let chipT;
function setChip(msg, o = {}){

function makeThumb(item, bg){
  const b = document.createElement('button');
  b.className = 'thumb'; b.title = item.name; b.setAttribute('aria-label', item.name);
  if (bg) b.style.backgroundImage = `url("${bg}")`;
  b.onclick = () => select(item, b);
  $('strip').appendChild(b);
  item.btn = b; return b;
}
async function addFiles(files, key){
  const added = [];
  for (const f of files){
    if (!f.type.startsWith('image/')) continue;
    const url = URL.createObjectURL(f);
    const img = new Image(); img.src = url;
    try { await img.decode(); } catch { toast(`เปิดไฟล์ ${f.name} ไม่ได้`); continue; }
    const item = { name: f.name, img, url, key: key || `file:${f.name}:${f.size}` };
    items.push(item); added.push(item);
    makeThumb(item, url);
  }
  if (added.length) select(added[added.length - 1], added[added.length - 1].btn);
  return added;
}
function select(item, btn){
  document.querySelectorAll('.thumb').forEach(t => t.removeAttribute('aria-current'));
  btn.setAttribute('aria-current','true');
  const prev = current; current = item;
  syncNav(); try { btn.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' }); } catch {}
  if (prev && prev !== item && prev.drive) prev.img = null;   // ปล่อยหน่วยความจำรูป Drive ที่ไม่ได้ดูแล้ว (เปิดกลับจากแคชได้ทันที)
  if (item.img){ item.info = setPano(item.img, item.name, item.key); chipFull(item.info); return; }
  $('title').textContent = item.name;                          // รูป Drive ที่ยังไม่มีภาพเต็มในหน่วยความจำ
  if (item.preview){ setPano(item.preview, item.name, item.key); setChip('ภาพตัวอย่างความละเอียดต่ำ · กำลังโหลดภาพเต็ม…'); }

// ---------- รูปก่อนหน้า/ถัดไป ----------
// รูป Drive: เลื่อนตามรายการรูปในโฟลเดอร์ที่เปิดมา (ไม่ใช่แค่รูปที่เคยเปิด) · รูปจากเครื่อง: เลื่อนตามแถบรูป
function navList(){ return current && current.drive && current.siblings ? current.siblings.map(f => ({ drive: f, name: f.name })) : items; }
function navIndex(list){ return current && current.drive && current.siblings ? list.findIndex(x => x.drive.id === current.drive.id) : list.indexOf(current); }
function syncNav(){
  const list = navList(), i = navIndex(list), n = list.length;
  $('prevBtn').hidden = $('nextBtn').hidden = n < 2;
  $('prevBtn').disabled = i <= 0; $('nextBtn').disabled = i < 0 || i >= n - 1;
}
function step(d){
  const list = navList(), i = navIndex(list), j = i + d;
  if (i < 0 || j < 0 || j >= list.length) return;
  if (current.drive && current.siblings) openDriveImage(list[j].drive, current.siblings);
  else select(items[j], items[j].btn);

// ---------- บันทึกภาพมุมมองปัจจุบัน (JPG + แถบชื่อรูป/วันที่/โลโก้) ----------
const snapLogo = new Image(); snapLogo.src = 'logo.png';
function snapshot(){
  if (!U.tex.value){ toast('ยังไม่มีรูป'); return; }
  renderer.render(scene, camera);                                  // วาดซ้ำแล้วคัดลอกทันทีในรอบเดียวกัน (canvas ไม่ได้เปิด preserveDrawingBuffer)
  const gl = renderer.domElement, W = gl.width, H = gl.height, k = W / innerWidth;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d'); g.drawImage(gl, 0, 0);
  const name = current ? current.name : ($('title').textContent || '');
  const when = new Date(), dateTxt = when.toLocaleString('th-TH', { dateStyle: 'medium', timeStyle: 'short' });
  const view = ['ปกติ', 'กว้างพิเศษ', 'ตรง', 'กว้าง'][mode] + (mode === 0 ? ` ×${zoomX().toFixed(1)} (FOV ${Math.round(fov)}°)` : '');
  const bh = Math.round(72 * k), pad = Math.round(10 * k), ls = bh - pad * 2;
  g.fillStyle = 'rgba(16,26,52,.82)'; g.fillRect(0, H - bh, W, bh);
  g.fillStyle = '#f2b705'; g.fillRect(0, H - bh, W, Math.max(1, Math.round(2 * k)));
  g.fillStyle = '#fff'; g.beginPath(); g.roundRect ? g.roundRect(pad, H - bh + pad, ls, ls, 8 * k) : g.rect(pad, H - bh + pad, ls, ls); g.fill();
  if (snapLogo.complete && snapLogo.naturalWidth){ const q = ls - 6 * k; g.drawImage(snapLogo, pad + 3 * k, H - bh + pad + 3 * k, q, q); }
  const tx = pad * 2 + ls, ff = '"IBM Plex Sans Thai", sans-serif';
  g.textBaseline = 'alphabetic'; g.fillStyle = '#fff';
  g.font = `600 ${15 * k}px ${ff}`; g.fillText(fitText(g, name, W - tx - pad), tx, H - bh + pad + 16 * k);
  g.font = `400 ${11.5 * k}px ${ff}`; g.fillStyle = 'rgba(255,255,255,.85)';
  g.fillText(fitText(g, 'คริสตัล เอ็นจิเนียริ่ง คอร์ปอเรชั่น', W - tx - pad), tx, H - bh + pad + 34 * k);
  g.fillText(fitText(g, `${dateTxt} · ${view}`, W - tx - pad), tx, H - bh + pad + 52 * k);
  const stamp = when.toISOString().slice(0, 19).replace(/[-:]/g, '').replace('T', '-');
  const fname = `siteview_${(name || 'view').replace(/\.[^.]+$/, '').replace(/[^\w\u0E00-\u0E7F-]+/g, '_')}_${stamp}.jpg`;
  c.toBlob(async blob => {
    if (!blob){ toast('บันทึกภาพไม่สำเร็จ'); return; }
    const file = new File([blob], fname, { type: 'image/jpeg' });

      if (navigator.canShare && navigator.canShare({ files: [file] })){ await navigator.share({ files: [file] }); toast('ส่งภาพแล้ว'); return; }

    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = fname;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast('บันทึกภาพแล้ว');
  }, 'image/jpeg', 0.92);

function fitText(g, t, maxW){ if (g.measureText(t).width <= maxW) return t; while (t.length > 1 && g.measureText(t + '…').width > maxW) t = t.slice(0, -1); return t + '…'; }

}
function store(k, v){ try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} }
function load(k){ try { return localStorage.getItem(k); } catch { return null; } }

function waitFor(test, ms = 8000){
  return new Promise((res, rej) => { const t0 = Date.now();
    (function tick(){ if (test()) res(); else if (Date.now() - t0 > ms) rej(new Error('timeout')); else setTimeout(tick, 100); })(); });
}
async function signIn(){
  if (!hasClient) throw new Error('private');
  await waitFor(() => window.google && google.accounts && google.accounts.oauth2);
  if (!tokenClient) tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: DC.CLIENT_ID, scope: 'https://www.googleapis.com/auth/drive.readonly', callback: () => {} });
  return new Promise((res, rej) => {
    tokenClient.callback = r => { if (r.error) return rej(new Error(r.error));
      token = r.access_token; tokenExp = Date.now() + r.expires_in * 1000; store('sv360.signedin', '1'); res(); };
    tokenClient.error_callback = e => rej(new Error(e.type || 'popup'));
    tokenClient.requestAccessToken({ prompt: token ? '' : 'select_account' });
  });
}
// ลองด้วย API key ก่อน (โฟลเดอร์แชร์ทุกคนที่มีลิงก์) ถ้าไม่ได้ค่อยล็อกอิน
async function api(url, asBlob = false){
  const go = () => {
    const u = new URL(url), h = {};
    u.searchParams.set('supportsAllDrives', 'true');
    if (token && Date.now() < tokenExp - 60000) h.Authorization = `Bearer ${token}`;
    else if (hasKey) u.searchParams.set('key', DC.API_KEY);
    return fetch(u, { headers: h });
  };
  let r = await go();
  if ((r.status === 401 || r.status === 403 || r.status === 404) && hasClient){
    if (!navigator.userActivation || !navigator.userActivation.isActive) throw new Error('needtap');
    await signIn(); r = await go();
  }
  if (!r.ok) throw new Error(r.status === 404 ? 'notfound' : r.status === 403 ? 'forbidden' : `HTTP ${r.status}`);
  return asBlob ? r : r.json();
}
async function listFolder(id){
  const out = []; let page = '';
  do {
    const u = new URL(API);
    u.searchParams.set('q', `'${id}' in parents and trashed = false and (mimeType = 'application/vnd.google-apps.folder' or mimeType contains 'image/')`);
    u.searchParams.set('fields', 'nextPageToken,files(id,name,mimeType,modifiedTime,size,thumbnailLink,imageMediaMetadata(width,height))');
    u.searchParams.set('orderBy', 'folder,modifiedTime desc');
    u.searchParams.set('pageSize', '200');
    u.searchParams.set('includeItemsFromAllDrives', 'true');
    if (page) u.searchParams.set('pageToken', page);
    const j = await api(u.toString());
    out.push(...j.files); page = j.nextPageToken;
  } while (page);
  return out;
}

const sheet = $('sheet'), body = $('sheetBody'), crumbs = $('crumbs');
const fmtDate = t => new Date(t).toLocaleDateString('th-TH', { day:'numeric', month:'short', year:'2-digit', hour:'2-digit', minute:'2-digit' });
const folderIcon = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>';

function showLinkForm(msg){
  if (lockedId){
    crumbs.innerHTML = '<span>Google Drive</span>';
    body.innerHTML = '<div class="empty"></div>';
    body.firstChild.textContent = msg || 'เชื่อมโฟลเดอร์ไม่ได้';
    const b = document.createElement('button'); b.className = 'btn'; b.textContent = 'ลองใหม่'; b.style.justifySelf = 'start';
    b.onclick = () => connect(lockedId); body.appendChild(b);
    return;
  }
  crumbs.innerHTML = '<span>เชื่อมโฟลเดอร์ Google Drive</span>';
  body.innerHTML = `<form class="linkform" id="linkForm">
    <div class="empty">${msg || 'วางลิงก์โฟลเดอร์ Google Drive ที่ทีมใช้อัปรูป 360'}</div>
    <input id="linkInput" type="url" inputmode="url" placeholder="https://drive.google.com/drive/folders/..." value="${rootId ? 'https://drive.google.com/drive/folders/' + rootId : ''}">
    <button class="btn" type="submit">${hasClient ? 'เชื่อมโฟลเดอร์ / ล็อกอิน Google' : 'เชื่อมโฟลเดอร์'}</button></form>`;
  $('linkForm').onsubmit = e => { e.preventDefault();
    const id = parseFolderId($('linkInput').value);
    if (!id){ toast('ลิงก์ไม่ถูกต้อง ต้องเป็นลิงก์โฟลเดอร์ (…/folders/…)'); return; }
    connect(id);
  };
}
async function connect(id){
  rootId = id; path = []; if (!lockedId) store('sv360.folder', id);
  body.innerHTML = '<div class="empty">กำลังเชื่อม…</div>';
  try {
    const meta = await api(`${API}/${id}?fields=name,mimeType`);
    if (meta.mimeType !== 'application/vnd.google-apps.folder') throw new Error('notfolder');
    path = [{ id, name: meta.name }];
    await renderFolder();
  } catch (e){ handleErr(e); }
}
function handleErr(e){
  const m = String(e.message || e);
  const msg = m === 'notfolder' ? 'ลิงก์นี้ไม่ใช่โฟลเดอร์'
    : m === 'private' || m === 'forbidden' || m === 'notfound'
      ? (hasClient ? 'เข้าถึงโฟลเดอร์ไม่ได้ — บัญชีที่ล็อกอินต้องมีสิทธิ์ดูโฟลเดอร์นี้' : 'โฟลเดอร์นี้ไม่ได้เปิด "ทุกคนที่มีลิงก์" และยังไม่ได้ตั้ง CLIENT_ID สำหรับล็อกอิน')
    : m === 'needtap' ? 'โฟลเดอร์นี้ต้องล็อกอิน Google — กดปุ่มด้านล่าง'
    : m === 'timeout' ? 'โหลดสคริปต์ Google ไม่ได้ ตรวจอินเทอร์เน็ต'
    : m.includes('popup') ? 'หน้าต่างล็อกอินถูกปิดหรือถูกบล็อก'
    : `เชื่อมไม่ได้: ${m}`;
  showLinkForm(msg);
}
let folderImages = [];                       // รูปในโฟลเดอร์ที่เปิดอยู่ล่าสุด (ใช้กับปุ่มก่อนหน้า/ถัดไป)
async function renderFolder(){
  const cur = path[path.length - 1];
  crumbs.innerHTML = '';
  path.forEach((p, i) => {
    if (i) crumbs.insertAdjacentHTML('beforeend', '<span>›</span>');
    const b = document.createElement('button'); b.textContent = p.name;
    b.onclick = () => { path = path.slice(0, i + 1); renderFolder(); };
    crumbs.appendChild(b);
  });
  crumbs.scrollLeft = crumbs.scrollWidth;
  body.innerHTML = '<div class="empty">กำลังโหลดรายการ…</div>';
  let files;
  try { files = await listFolder(cur.id); } catch (e){ return handleErr(e); }
  if (path[path.length - 1] !== cur) return;   // user navigated away meanwhile
  body.innerHTML = '';
  if (!files.length){ body.innerHTML = '<div class="empty">โฟลเดอร์นี้ยังไม่มีรูป</div>'; return; }
  folderImages = files.filter(f => f.mimeType !== 'application/vnd.google-apps.folder');
  for (const f of files){
    const el = document.createElement('button'); el.className = 'item';
    if (f.mimeType === 'application/vnd.google-apps.folder'){
      el.classList.add('folder');
      el.innerHTML = folderIcon + '<span class="nm"></span>';
      el.querySelector('.nm').textContent = f.name;
      el.onclick = () => { path.push({ id: f.id, name: f.name }); renderFolder(); };
    } else {
      const md = f.imageMediaMetadata || {}, r = md.width && md.height ? md.width / md.height : 0;
      el.innerHTML = `<div class="pic">${Math.abs(r - 2) < 0.05 ? '<b>360°</b>' : ''}</div><div class="nm"></div><div class="dt"></div>`;
      el.querySelector('.nm').textContent = f.name;
      el.querySelector('.dt').textContent = fmtDate(f.modifiedTime) + (f.size ? ` · ${(f.size / 1048576).toFixed(1)} MB` : '');
      if (f.thumbnailLink){
        const im = new Image(); im.referrerPolicy = 'no-referrer';
        im.onload = () => { el.querySelector('.pic').style.backgroundImage = `url("${im.src}")`; };
        im.src = f.thumbnailLink.replace(/=s\d+$/, '=s800');
      }
      const sib = folderImages;
      el.onclick = () => openDriveImage(f, sib);
    }
    body.appendChild(el);
  }
}
// ---- แคชไฟล์ต้นฉบับในเครื่อง (Cache API) — เปิดซ้ำไม่ต้องโหลดใหม่ จำกัดขนาดรวม ลบตัวที่เก่าสุดก่อน ----
const CACHE_NAME = 'sv360-img', CACHE_CAP = 300 * 1048576, CACHE_IDX = 'sv360.cache.idx';
const cacheUrl = k => '/__sv360/' + encodeURIComponent(k);
function idxRead(){ try { const a = JSON.parse(load(CACHE_IDX)); return Array.isArray(a) ? a : []; } catch { return []; } }
async function cacheGet(k){
  try {
    if (!window.caches) return null;
    const c = await caches.open(CACHE_NAME), r = await c.match(cacheUrl(k));
    if (!r) return null;
    const idx = idxRead(), e = idx.find(x => x.k === k);
    if (e){ e.t = Date.now(); store(CACHE_IDX, JSON.stringify(idx)); }
    return await r.blob();
  } catch { return null; }
}
async function cachePut(k, file){
  try {
    if (!window.caches || file.size > CACHE_CAP) return;
    const c = await caches.open(CACHE_NAME);
    await c.put(cacheUrl(k), new Response(file, { headers: { 'content-type': file.type || 'image/jpeg' } }));
    const idx = idxRead().filter(x => x.k !== k); idx.push({ k, size: file.size, t: Date.now() });
    idx.sort((a, b) => a.t - b.t);
    let total = idx.reduce((s, x) => s + x.size, 0);
    while (total > CACHE_CAP && idx.length > 1){ const o = idx.shift(); total -= o.size; await c.delete(cacheUrl(o.k)); }
    for (const rq of await c.keys()){                           // เก็บกวาดไฟล์ที่ไม่อยู่ในดัชนี (เช่นล้าง localStorage ไปแล้ว)
      const p = new URL(rq.url).pathname;
      if (!idx.some(x => cacheUrl(x.k) === p)) await c.delete(rq);
    }
    store(CACHE_IDX, JSON.stringify(idx));
  } catch {}
}

// ไฟล์ต้นฉบับครบทุกไบต์ (ไม่ใช่ภาพย่อ): แคชก่อน ไม่มีค่อยโหลดจาก Drive แล้วตรวจขนาดให้ตรงกับที่ Drive แจ้ง
async function getFullFile(f, onProg){
  const k = `${f.id}/${f.modifiedTime}`;
  const hit = await cacheGet(k);
  if (hit) return { file: new File([hit], f.name, { type: hit.type || f.mimeType || 'image/jpeg' }), cached: true, put: Promise.resolve() };
  const r = await api(`${API}/${f.id}?alt=media`, true);
  const total = +f.size || +r.headers.get('content-length') || 0;
  const reader = r.body.getReader(), chunks = []; let got = 0;
  for (;;){ const { done, value } = await reader.read(); if (done) break; chunks.push(value); got += value.length; if (onProg) onProg(got, total); }
  if (+f.size && got !== +f.size) throw new Error('ไฟล์โหลดไม่ครบ');
  const file = new File(chunks, f.name, { type: f.mimeType || 'image/jpeg' });
  return { file, cached: false, put: cachePut(k, file) };
}
// ภาพตัวอย่าง: ภาพย่อ 2048 px จาก Google (ย่อฝั่งเซิร์ฟเวอร์ ไฟล์เล็ก) — ใช้เป็น texture ได้เฉพาะถ้าเซิร์ฟเวอร์อนุญาต CORS ถ้าไม่ได้ก็ข้ามไปเฉยๆ
function loadPreview(f){
  return new Promise(res => {
    if (!f.thumbnailLink || !/=s\d+$/.test(f.thumbnailLink)) return res(null);
    const im = new Image(); im.crossOrigin = 'anonymous'; im.referrerPolicy = 'no-referrer';
    im.onload = () => res(im); im.onerror = () => res(null);
    im.src = f.thumbnailLink.replace(/=s\d+$/, '=s2048');
  });
}
async function decodeFile(file){
  const url = URL.createObjectURL(file), img = new Image(); img.src = url;
  try { await img.decode(); } finally { URL.revokeObjectURL(url); }
  return img;
}
function driveThumb(item, f){
  if (!f.thumbnailLink) return;
  const im = new Image(); im.referrerPolicy = 'no-referrer';
  im.onload = () => { item.btn.style.backgroundImage = `url("${im.src}")`; };
  im.src = f.thumbnailLink.replace(/=s\d+$/, '=s192');
}

async function loadDriveItem(it){
  const f = it.drive, stillCurrent = () => current === it;
  const md = f.imageMediaMetadata || {}, orig = md.width && md.height ? ` · ต้นฉบับ ${md.width}×${md.height}` : '';
  const isPreview = () => !!it.preview && shown === it.preview;
  it.loading = true; const t0 = performance.now();
  setChip('กำลังเปิด…' + orig);
  try {
    if (!it.preview) loadPreview(f).then(im => {                 // 1) ภาพตัวอย่างขนานกับดาวน์โหลดจริง
      if (!im) return; it.preview = im;
      if (!it.img && stillCurrent()){ setPano(im, it.name, it.key); setChip('ภาพตัวอย่างความละเอียดต่ำ · กำลังโหลดภาพเต็ม…' + orig); }
    });
    const t1 = performance.now();                                 // 2) ไฟล์ต้นฉบับ (แคช → Drive)
    const { file, cached, put } = await getFullFile(f, (got, total) => {
      if (stillCurrent()) setChip(`${isPreview() ? 'ภาพตัวอย่างความละเอียดต่ำ · ' : ''}กำลังโหลดภาพเต็ม${total ? ' ' + Math.round(got / total * 100) + '%' : ''}${orig}`);
    });
    const t2 = performance.now();
    const img = await decodeFile(file);
    const t3 = performance.now();
    if (!stillCurrent()){ await put; return; }                    // ผู้ใช้ไปดูรูปอื่นแล้ว: เก็บไฟล์ลงแคชไว้ให้เปิดครั้งหน้าเร็ว
    const keep = isPreview();                                     // สลับตัวอย่าง→ภาพเต็มโดยไม่เสียมุมที่กำลังดู
    it.img = img;
    it.info = setPano(img, it.name, it.key, { keep });
    chipFull(it.info, `${cached ? 'จากแคช' : 'โหลด'} ${((t2 - t1) / 1000).toFixed(1)}s · decode ${Math.round(t3 - t2)}ms · texture ${it.info.ms}ms · รวม ${((performance.now() - t0) / 1000).toFixed(1)}s`);
  } catch (e){
    if (stillCurrent()) setChip(isPreview() ? 'โหลดภาพเต็มไม่สำเร็จ — ตอนนี้เห็นแค่ภาพตัวอย่างความละเอียดต่ำ' : '', { warn: true });
    toast(`โหลด ${f.name} ไม่ได้ (${e.message})`);
  } finally { it.loading = false; }
}
function openDriveImage(f, sib){
  const ck = f.id + f.modifiedTime;
  let it = driveCache.get(ck);
  if (!it){
    it = { name: f.name, key: 'drive:' + f.id, drive: f, img: null, preview: null, loading: false };
    items.push(it); makeThumb(it, null); driveThumb(it, f); driveCache.set(ck, it);
  }
  if (sib) it.siblings = sib;
  sheet.classList.remove('on');
  select(it, it.btn);
}

$('driveBtn').addEventListener('click', () => {
  if (!hasKey && !hasClient){ toast('ยังไม่ได้ใส่ API_KEY ใน DRIVE_CONFIG'); return; }
  const open = sheet.classList.toggle('on');
  if (open && !path.length){ rootId ? connect(rootId) : showLinkForm(); }
});
$('closeSheet').onclick = () => sheet.classList.remove('on');
$('refreshBtn').onclick = () => path.length ? renderFolder() : rootId && connect(rootId);
$('linkBtn').onclick = () => showLinkForm();
addEventListener('keydown', e => { if (e.key === 'Escape') sheet.classList.remove('on'); });

// โฟลเดอร์เริ่มต้น: ?folder=ลิงก์หรือID  >  ที่เคยเชื่อมไว้  >  DEFAULT_FOLDER
const lockedId = DC.LOCK_FOLDER ? parseFolderId(DC.DEFAULT_FOLDER) : null;
if (lockedId){ $('linkBtn').hidden = true; store('sv360.folder', null); }
rootId = lockedId || parseFolderId(new URLSearchParams(location.search).get('folder')) || load('sv360.folder') || parseFolderId(DC.DEFAULT_FOLDER);
if (rootId && (hasKey || hasClient)) setTimeout(() => { sheet.classList.add('on'); connect(rootId); }, 300);

// start
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => {
  setPano(demoPano(), 'ภาพตัวอย่าง (กริดทดสอบทิศ)');
  requestAnimationFrame(loop);
});
})();
</script>
